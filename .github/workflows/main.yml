EIIS ENGINE

Formula:

EIIS =
30% EIC
20% ESG
15% TBL
15% EVA
10% Quality
10% Risk Resilience

Output:
0-100

Grades:

90-100 Elite
80-89 Excellent
70-79 Strong
60-69 Moderate
Below 60 Weak

